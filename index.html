<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitmiş Ürün Ambarı — Bloklu Lastik Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* --- Kurumsal Renk Paleti (birebir) --- */
    --primary:#1C2B6E;         /* Ana Lacivert */
    --primary-hover:#1e40af;   /* Hover Mavi/Lacivert */
    --accent:#F0B323;          /* Ana Sarı */
    --accent-hover:#EAB308;    /* Hover Sarı */
    --bg-dark:#162560;         /* Tablo & Yan Menü Laciverti */
    --text-dark:#0F172A;       /* Koyu Metin / Başlık */
    --bg-light-yellow:#FEFCE8; /* Açık Sarı Kart Arka Planı */

    /* --- Bu paletten türetilen destekleyici değişkenler --- */
    --bg:var(--bg-light-yellow);
    --surface:#ffffff;
    --surface-2:#f7f8fb;
    --surface-3:#eef1f6;
    --line:#e3e7ee;
    --line-strong:#d6dbe4;
    --navy:var(--primary);
    --navy-2:var(--bg-dark);
    --navy-tint:var(--bg-light-yellow);
    --accent-2:var(--accent-hover);
    --accent-tint:var(--bg-light-yellow);
    --accent-tint-strong:#f8ecc0;
    --red:#dc3545;
    --red-tint:#fbe7e9;
    --green:#1f9d55;
    --green-tint:#e6f6ec;
    --text:var(--text-dark);
    --heading:var(--text-dark);
    --muted:#66738c;
    --muted-2:#8892a6;
    --mono:'Roboto Mono', monospace;
    --font:'Inter',system-ui,sans-serif;
    --font-head:'Manrope',system-ui,sans-serif;
    --radius:12px;
    --radius-sm:8px;
    --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(28,43,110,.06);
    --shadow-md:0 6px 20px rgba(28,43,110,.08);
    --shadow-lg:0 18px 46px rgba(28,43,110,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(135deg, var(--primary) 0%, var(--bg-dark) 42%, #4b4420 75%, var(--accent) 100%) fixed;
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Giriş ekranı ---------- */
  .giris-overlay{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 20% 10%, rgba(240,179,35,.16) 0%, rgba(240,179,35,0) 45%),
      linear-gradient(150deg, var(--primary) 0%, var(--bg-dark) 48%, #4b4420 80%, var(--accent-hover) 100%);
  }
  .giris-panel{
    width:100%;
    max-width:360px;
    background:linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);
    border-radius:var(--radius-lg);
    padding:36px 32px 30px;
    text-align:center;
    box-shadow:0 18px 46px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .giris-panel .giris-baslik{
    font-family:var(--font-head);
    font-weight:800;
    font-size:19px;
    color:#fff;
    margin:0 0 4px;
  }
  .giris-panel .giris-alt{
    color:#c3cce3;
    font-size:13.5px;
    margin:0 0 22px;
  }
  .giris-panel input{
    width:100%;
    padding:13px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line-strong);
    background:var(--surface-2);
    color:var(--text);
    font-size:16px;
    text-align:center;
    letter-spacing:.1em;
    margin-bottom:14px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .giris-panel input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-tint);
  }
  .giris-panel button{
    width:100%;
    padding:13px 14px;
    border-radius:var(--radius-sm);
    border:none;
    background:var(--accent);
    color:var(--navy);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:background .15s;
  }
  .giris-panel button:hover{background:var(--accent-2);color:var(--primary);}
  .giris-hata{
    color:var(--red);
    font-size:12.5px;
    margin:12px 0 0;
    min-height:16px;
  }

  /* ---------- Navbar ---------- */
  .navbar{
    background:var(--navy);
    color:#fff;
  }
  .navbar-inner{
    width:100%;
    margin:0;
    padding:16px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .navbar-brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand-text{display:flex;flex-direction:column;min-width:0;}
  .brand-title{
    font-family:var(--font-head);
    font-weight:800;
    font-size:22px;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--accent);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-title span{color:var(--accent);}
  .brand-sub{
    font-size:12px;
    color:#aab6cf;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .navbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .navbar-date{
    height:36px;
    padding:0 14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    border-radius:9px;
    color:#fff;
    font-family:var(--font-head);
    font-weight:600;
    font-size:13px;
    outline:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:border-color .15s, background .15s;
  }
  .navbar-date svg{flex-shrink:0;color:var(--accent);}
  .navbar-date:hover{border-color:rgba(255,255,255,.35);}
  .navbar-date:focus{border-color:var(--accent);background:rgba(255,255,255,.1);}

  /* ---------- Takvim modalı ---------- */
  .takvim-modal-card{max-width:340px;}
  .takvim-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .takvim-nav-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--navy);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, background .15s, color .15s;
  }
  .takvim-nav-btn:hover{border-color:var(--accent);color:var(--primary);background:var(--accent-tint);}
  .takvim-ay-yil{font-family:var(--font-head);font-weight:700;font-size:14.5px;color:var(--navy);text-transform:capitalize;}
  .takvim-gun-basliklari{
    display:grid;grid-template-columns:repeat(7,1fr);
    margin-top:14px;
    font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.03em;
  }
  .takvim-grid{
    display:grid;grid-template-columns:repeat(7,1fr);
    gap:3px;
    margin-top:6px;
  }
  .takvim-gun{
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    font-size:13px;font-weight:600;color:var(--text);
    background:transparent;border:1px solid transparent;
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .takvim-gun:hover{border-color:var(--accent);background:var(--accent-tint);}
  .takvim-gun.disi{color:var(--muted-2);opacity:.45;}
  .takvim-gun.bugun{border-color:var(--navy-2);color:var(--navy);font-weight:700;}
  .takvim-gun.secili{background:var(--accent);border-color:var(--accent);color:var(--navy);}
  .takvim-gun.secili:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--primary);}
  .ay-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:14px;
  }
  .ay-hucre{
    padding:14px 6px;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;
    font-size:13.5px;font-weight:700;color:var(--text);
    background:transparent;border:1px solid var(--line);
    cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .ay-hucre:hover{border-color:var(--accent);background:var(--accent-tint);}
  .ay-hucre.bu-ay{border-color:var(--navy-2);color:var(--navy);}
  .ay-hucre.secili{background:var(--accent);border-color:var(--accent);color:var(--navy);}
  .ay-hucre.secili:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--primary);}
  @media (max-width:820px){
    .navbar-inner{flex-wrap:wrap;row-gap:10px;}
    .navbar-right{width:100%;justify-content:flex-start;}
  }
  .conn-badge{
    display:flex;align-items:center;gap:7px;
    font-size:12px;
    color:#c3ccdf;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    padding:7px 13px;
    border-radius:20px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2);flex-shrink:0;}
  .dot.ok{background:#3ddc84;}
  .dot.err{background:#ff5a67;}

  /* ---------- Tab bar (iPhone tarzı segmented pill) ---------- */
  .tabbar{
    background:var(--navy-2);
    border-top:1px solid rgba(255,255,255,.06);
    padding:10px 0;
  }
  .tabbar-inner{
    width:100%;
    margin:0;
    padding:0 40px;
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabbar-inner::-webkit-scrollbar{display:none;}
  .tabs{
    display:inline-flex;
    background:rgba(255,255,255,.08);
    border-radius:12px;
    padding:3px;
    gap:2px;
    flex:0 0 auto;
  }
  .tab{
    flex:0 0 auto;
    padding:9px 18px;
    text-align:center;
    color:#aab6cf;
    font-family:var(--font-head);
    font-weight:600;
    font-size:13px;
    letter-spacing:.01em;
    cursor:pointer;
    white-space:nowrap;
    border-radius:9px;
    transition:color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .tab:hover{color:#fff;}
  .tab.active{
    color:var(--navy);
    background:var(--accent);
    box-shadow:0 1px 4px rgba(0,0,0,.28), 0 1px 1px rgba(0,0,0,.1);
  }

  /* ---------- Layout ---------- */
  main{
    width:100%;
    margin:0;
    padding:28px 40px 70px;
    background:transparent;
  }
  .view{display:none;}
  .view.active{display:block;}

  .page-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin:0 0 22px;
    flex-wrap:wrap;
  }
  .page-head h1{
    font-family:var(--font-head);
    font-weight:800;
    font-size:clamp(20px,2.6vw,26px);
    color:var(--heading);
    margin:0 0 4px;
  }
  .page-head p{
    margin:0;
    color:var(--muted);
    font-size:13.5px;
  }
  .accent-heading{color:var(--accent) !important;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:26px clamp(20px,3vw,30px);
    margin-bottom:22px;
    box-shadow:var(--shadow-sm);
  }
  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:0 0 18px;
    flex-wrap:wrap;
  }
  .card-title{
    font-family:var(--font-head);
    font-weight:700;
    font-size:15.5px;
    color:var(--heading);
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-title .tag-count{
    font-family:var(--mono);
    font-size:11.5px;
    font-weight:600;
    color:var(--primary);
    background:var(--accent-tint);
    padding:3px 10px;
    border-radius:20px;
  }
  .card-desc{
    color:var(--muted);
    font-size:12.5px;
    margin:2px 0 0;
  }

  /* ---------- Form controls (tek satır kompakt giriş) ---------- */
  .entry-row{
    display:flex;
    align-items:flex-end;
    gap:10px;
    flex-wrap:nowrap;
  }
  .entry-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }
  .entry-field-bulk{flex:1 1 auto;}
  .entry-field-save{flex:0 0 auto;}
  .entry-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--accent);
  }
  #view-ekle .entry-label{color:var(--accent);}
  .entry-label-hidden{visibility:hidden;}
  .entry-kod-input{
    flex:0 0 auto;
    width:190px;
    max-width:190px;
    height:42px;
    padding:0 12px !important;
  }
  .bulk-box{
    position:relative;
    flex:1 1 auto;
    min-width:0;
    height:42px;
  }
  .bulk-box textarea#bulkInput{
    width:100%;
    height:42px;
    min-height:42px;
    max-height:42px;
    line-height:40px;
    padding:0 40px 0 12px;
    white-space:pre;
    overflow-x:auto;
    overflow-y:hidden;
    resize:none;
  }
  .bulk-expand-btn{
    position:absolute;
    top:50%;
    right:5px;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    border-radius:8px;
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--muted);
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .bulk-expand-btn:hover{color:var(--primary);border-color:var(--accent);background:var(--accent-tint);}
  .beadcod-hucre{display:flex;align-items:center;gap:8px;max-width:340px;}
  .beadcod-metin{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .beadcod-buyut-btn{
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:7px;
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--muted);
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .beadcod-buyut-btn:hover{color:var(--primary);border-color:var(--accent);background:var(--accent-tint);}
  .beadcod-goruntule-liste{
    display:flex;flex-wrap:wrap;gap:7px;
    max-height:50vh;overflow-y:auto;
    padding:2px;
  }
  .beadcod-chip{
    font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy);
    background:var(--navy-tint);border:1px solid var(--line);
    border-radius:7px;padding:5px 10px;
  }
  @media (max-width:700px){
    .entry-row{flex-wrap:wrap;}
    .entry-field{flex:1 1 auto;max-width:none;}
    .entry-kod-input{flex:1 1 auto;width:100%;max-width:none;}
    .entry-field-bulk{flex:1 1 100%;order:2;}
    .entry-field-save{flex:1 1 100%;order:3;}
    .entry-row .btn-kaydet-full{flex:1 1 100%;order:3;}
  }
  input[type=text], input[type=password]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line-strong);
    color:var(--text);
    font-family:var(--mono);
    font-size:14.5px;
    letter-spacing:.01em;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=text]:focus, input[type=password]:focus{
    border-color:var(--accent);
    background:var(--surface);
    box-shadow:0 0 0 3px var(--accent-tint);
  }
  input[type=text]::placeholder{color:var(--muted-2);}
  textarea{
    width:100%;
    min-height:110px;
    background:var(--surface-2);
    border:1px solid var(--line-strong);
    color:var(--text);
    font-family:var(--mono);
    font-size:14px;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    outline:none;
    resize:vertical;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  textarea:focus{
    border-color:var(--accent);
    background:var(--surface);
    box-shadow:0 0 0 3px var(--accent-tint);
  }

  button{
    font-family:var(--font-head);
    font-weight:600;
    letter-spacing:.01em;
    border:none;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s, transform .06s, box-shadow .15s;
  }
  button:active{transform:translateY(1px);}

  .add-row{display:flex;gap:10px;}
  .btn-add{
    background:var(--accent);
    color:var(--navy);
    padding:12px 24px;
    font-size:13.5px;
    box-shadow:var(--shadow-sm);
  }
  .btn-add:hover{background:var(--accent-2);color:var(--primary);}
  .btn-add:disabled{opacity:.5;cursor:not-allowed;}

  .msg{display:block;font-size:12.5px;margin-top:10px;min-height:16px;}
  .msg.err{color:var(--red);}
  .msg.ok{color:var(--green);}

  .entry-actions{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:10px;
  }
  .btn-kaydet-full{
    flex:0 0 auto;
    height:42px;
    padding:0 28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:var(--radius-sm);
    border:none;
    background:var(--accent);
    color:var(--navy);
    font-family:var(--font-head);
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(240,179,35,.32);
  }
  .btn-kaydet-full:hover{background:var(--accent-2);color:var(--primary);}
  .btn-kaydet-full:disabled{opacity:.55;cursor:not-allowed;}
  .entry-card .msg{margin:0;}
  .entry-actions .msg{flex:1;}

  .btn-danger{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
    padding:8px 16px;
    font-size:12.5px;
  }
  .btn-danger:hover{background:var(--red-tint);}

  .btn-secondary{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--text);
    padding:8px 16px;
    font-size:12.5px;
    font-weight:600;
  }
  .btn-secondary:hover{background:var(--surface-2);border-color:var(--muted-2);}

  /* ---------- Onay (silme) modalı: modern uyarı kutusu ---------- */
  .onay-modal-card{
    max-width:360px;
    text-align:center;
    padding:32px 26px calc(24px + env(safe-area-inset-bottom));
  }
  .onay-ikon{
    width:52px;height:52px;
    margin:0 auto 16px;
    border-radius:50%;
    background:var(--red-tint);
    color:var(--red);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-head);
    font-weight:800;
    font-size:26px;
  }
  .onay-baslik{
    font-family:var(--font-head);
    font-weight:800;
    font-size:17px;
    color:var(--heading);
    margin:0 0 8px;
  }
  .onay-metin{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
    margin:0 0 22px;
  }
  .onay-modal-card .modal-actions{margin-top:0;}

  .btn-upd{
    background:transparent;
    border:1px solid rgba(240,179,35,.5);
    color:var(--accent);
    padding:7px 14px;
    font-size:12px;
    font-weight:700;
  }
  .btn-upd:hover{border-color:var(--accent);color:var(--navy);background:var(--accent);}

  /* Bloklu bulunan kod: yeşil vurgulama */
  .beadcod-bulundu{color:#39d97a !important;font-weight:700;}

  /* "Bloklu Kod Listesi" başlığı: büyük ve sarı */
  .kod-listesi-baslik{
    font-size:26px !important;
    color:var(--accent) !important;
    text-transform:uppercase;
    letter-spacing:.02em;
  }

  /* ---------- Tablolar: 3D kabarık efekt (Kod Ekle + Bloklu Bulunan Lastikler) ---------- */
  .tablo-3d{
    border-radius:14px;
    padding:6px;
    background:linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
    box-shadow:
      6px 6px 14px rgba(0,0,0,.35),
      -4px -4px 12px rgba(255,255,255,.06),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .tablo-3d table{

  .giris-panel input{
    background:linear-gradient(160deg, #ffffff 0%, #eef1f8 55%, #dfe4ee 100%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:

      -6px -6px 14px rgba(255,255,255,.9),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -6px 10px rgba(28,43,110,.06);
    position:relative;
  }
  .giris-panel input:focus{
    background:linear-gradient(160deg, #ffffff 0%, #f5f2e0 55%, #ecdca0 100%);
    box-shadow:
      6px 6px 14px rgba(28,43,110,.18),
      -6px -6px 14px rgba(255,255,255,.9),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -6px 10px rgba(240,179,35,.18),

  /* ---------- Kod listesi (kart liste) ---------- */
  .code-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto;}
  .code-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 16px;
    height:60px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .code-item:hover{border-color:var(--accent);background:var(--surface);}
  .code-item-left{min-width:0;flex:1 1 auto;overflow:hidden;}
  .code-item .kod{
    font-family:var(--mono);
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--navy);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .code-item .kod .tarih-ek{
    font-family:var(--font-head);
    font-weight:500;
    color:var(--muted);
    font-size:11.5px;
    margin-left:8px;
  }
  .code-item .meta{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    line-height:1.5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .row-count{
    font-family:var(--mono);
    font-size:11.5px;
    font-weight:600;
    color:var(--primary);
    background:var(--accent-tint);
    padding:5px 12px;
    border-radius:14px;
    white-space:nowrap;
    cursor:pointer;
  }
  .row-count:hover{background:var(--accent-tint-strong);}
